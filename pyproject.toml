[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-ai-midas"
version = "0.1.0"
description = "Autonomous FinOps & Data Engineering Optimization Agent powered by FastMCP"
requires-python = ">=3.11"
authors = [
    { name = "Hermes FinOps Team", email = "engineering@hermes.ai" }
]
keywords = ["finops", "pyspark", "fastmcp", "ast", "airflow", "optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "mcp>=1.1.0,<2.0",
    "fastmcp>=0.1.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "croniter>=3.0.0",
    "apscheduler>=3.10.4",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "sqlglot>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[project.scripts]
hermes-midas = "hermes_midas.cli:main"
midas = "hermes_midas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_midas"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "tier1: Tier 1 Feature Unit Tests",
    "tier2: Tier 2 Boundary and Corner Case Tests",
    "tier3: Tier 3 Cross-Feature Integration Tests",
    "tier4: Tier 4 Real-World Application E2E Tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/hermes_midas"]
omit = ["tests/*"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".midas", "workloads"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Header/Depends)
    "SIM105", # try-except-pass (use contextlib.suppress)
]

[tool.ruff.lint.isort]
known-first-party = ["hermes_midas"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

